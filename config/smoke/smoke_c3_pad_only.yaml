# Smoke run 4 — PAD only (C3): privacy_aware_decoding ON, others OFF, DeepEval OFF
# PAD requires HF generation (logits processor); provider is set to huggingface.
# Validates: PAD -> HF batch generation stage; log line "Batch generating … HF + PAD" expected.
# Usage: python scripts/comprehensive_eval.py --config config/smoke/smoke_c3_pad_only.yaml --phase smoke

system:
  embedding_model: all-MiniLM-L6-v2
  llm:
    # PAD requires HF logits hooks; must be huggingface for PAD to attach.
    provider: huggingface
    model_path: meta-llama/Llama-3.1-8B-Instruct
    device: auto
    temperature: 0.0
    model_name: llama3
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.90
    max_model_len: 16384
  judge_llm: vllm/meta-llama/Llama-3.1-8B-Instruct

paths:
  chroma_db: data/chroma_db
  results: data/results
  cache: data/raw
  user_data: data/users

data:
  clear_chroma_before_run: false
  dataset: nq
  ingestion_size: 1000
  ingestion_seed: 42
  test_size: 20
  test_seed: 42

evaluation:
  skip_deepeval: true
  deepeval_max_concurrent: 1

retrieval:
  top_k: 5
  chunk_size: 512
  chunk_overlap: 50

defenses:
  - name: differential_privacy
    enabled: false
    method: dp_pure
    epsilon: 5.0
    delta: 1e-3
    candidate_multiplier: 3
  - name: trustrag
    enabled: false
    similarity_threshold: 0.88
    rouge_threshold: 0.25
    candidate_multiplier: 3
  - name: privacy_aware_decoding
    enabled: true
    noise_type: adaptive
    epsilon: 0.2
    alpha: 10.0
    delta: 1e-5
    enable_screening: true
    enable_calibration: true
    noise_amplification: 3.0
    min_sensitivity: 0.4
    static_noise_scale: 0.1
    candidate_multiplier: 3

attack:
  mba:
    enabled: false
    M: 5
    gamma: 0.35
    num_members: 30
    num_non_members: 20
    device: auto
    proxy_model: gpt2-xl
    enable_spelling_correction: false
    max_document_words: 200
    seed: 1235213
  poisoned_rag:
    enabled: false
    poisoning_rate: 10
    num_targets: 50
    seed: 42
    target_start_index: 0
    diversity_level: true
  ikea:
    enabled: false
    topic: ""
    n_rounds: 32
    max_corpus_chunks: 500

ado:
  enabled: false
  user_id: test_user_001
  sentinel_model: llama3
  strategist_model: llama3
  strategist_mode: llm
  trust_score_decay: 0.05
