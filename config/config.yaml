system:
  embedding_model: all-MiniLM-L6-v2
  llm:
    provider: vllm 
    model_path: meta-llama/Llama-3.1-8B-Instruct
    device: auto
    temperature: 0.0
    model_name: llama3
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.90
    max_model_len: 2048
  judge_llm: llama3

paths:
  chroma_db: data/chroma_db
  results: data/results
  cache: data/raw
data:
  dataset: triviaqa
  ingestion_size: 100
  ingestion_seed: 42
  test_size: 20
  test_seed: 123
evaluation:
  skip_deepeval: true
  deepeval_max_concurrent: 5
retrieval:
  top_k: 5
  chunk_size: 512
  chunk_overlap: 50
defenses:
- name: differential_privacy
  enabled: false
  method: dp_approx
  epsilon: 3.0
  delta: 0.01
  candidate_multiplier: 3
- name: trustrag
  enabled: false
  similarity_threshold: 0.88
  rouge_threshold: 0.25
  candidate_multiplier: 3
# Privacy-Aware Decoding (PAD): decode-time logits noise; requires system.llm.provider huggingface or hf
- name: privacy_aware_decoding
  enabled: false
  epsilon: 0.2
  noise_amplification: 3.0
  min_sensitivity: 0.4
  noise_type: adaptive
  enable_screening: true
  enable_calibration: true
  static_noise_scale: 0.1
  alpha: 10.0
  delta: 1.0e-5
  candidate_multiplier: 1
attack:
  mba:
    enabled: false
    M: 5
    gamma: 0.35
    num_members: 30
    num_non_members: 20
    device: auto
    proxy_model: gpt2-xl
    enable_spelling_correction: false
    max_document_words: 200
    seed: 1235213
  poisoned_rag:
    enabled: false
    poisoning_rate: 10
    num_targets: 50
    seed: 42
    target_start_index: 0
    diversity_level: true
  ikea:
    enabled: false
    topic: ""   # empty → inferred from data.dataset (see src/attacks/ikea.py)
    n_rounds: 32
    max_corpus_chunks: 500
ado:
  enabled: false
  user_id: test_user_001
  sentinel_model: llama3
  strategist_model: llama3
  strategist_mode: llm
  trust_score_decay: 0.05
